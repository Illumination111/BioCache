[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biocache"
version = "0.1.0"
description = "Bounded layered LIF memory: synthetic KV feasibility experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
